schema_version: 1
project: mediness
claims:
  - id: mediness.product-system-design-participation
    statement: MEDINESS 서비스 구현 담당자와 제품 요구·운영 흐름을 구체화하는 설계에 참여
    strength: contributed
    confidence: medium
    public: true
    evidence:
      - evidence/projects/mediness.md#product-design-participation
    allowed_copy:
      - MEDINESS 서비스 구현 담당자와 제품 요구·운영 흐름을 구체화하는 설계에 참여
      - 제품 요구와 운영 흐름을 구체화하는 설계에 참여
    forbidden_copy:
      - MEDINESS 서비스 직접 구현
      - architecture 또는 시스템 구조 설계 주도·전담
      - 공통 문서 pipeline 또는 architecture 최초 설계
      - 제품 기획 전담
    verified_at: 2026-08-17

  - id: mediness.product-operations
    statement: 제품팀의 일정·이슈·릴리스 운영을 pipeline registry와 decision·spec·work·release gate로 구조화하고 리드
    strength: led
    confidence: high
    public: true
    evidence: [evidence/projects/mediness.md#product-operations]
    allowed_copy:
      - pipeline registry와 release gate 기반 제품팀 일정·이슈·릴리스 운영 리드
      - 제품 결정을 BE·FE·QA·release gate 실행으로 연결하는 제품 운영 리드
      - 제품별 Decision·SPEC·Work Package를 실행 원장으로 적용하고 BE·FE·QA owner lane과 QA approval을 release gate에 연결
      - release gate·version cut을 실제 완료 시점에 연결해 release note 생성을 자동화하고 버전 변경 이력을 추적
    forbidden_copy:
      - 제품 기획 전담
      - 조직 전체 운영 총괄
      - 전사 문서 pipeline 규칙 단독 설계
    verified_at: 2026-08-18

  - id: mediness.product-development-coordination-leverage
    statement: 기획·디자인·개발·QA·릴리즈의 decision·spec·work·release evidence와 agent context를 하나의 실행 맥락으로 축적해 반복 조율과 담당자 변경 시 맥락 복원 비용을 낮추고 유사 기능·후속 변경의 lead time 단축에 기여
    strength: led
    confidence: medium
    public: true
    evidence: [evidence/projects/mediness.md#product-development-coordination-leverage]
    allowed_copy:
      - 기획·디자인·개발·QA·릴리즈의 결정과 진행 상태를 하나의 실행 맥락으로 연결
      - 사람과 AI가 같은 제품·architecture 맥락을 읽도록 해 상태 확인·맥락 재설명·결정 재확인의 반복 조율 비용을 낮춤
      - 기존 decision·spec·구현 기준을 재사용해 유사 기능과 후속 변경의 lead time 단축에 기여
      - 담당자가 바뀌어도 누적된 decision·spec·ADR·runbook·agent context에서 업무를 이어갈 수 있어 인수인계·맥락 복원 비용을 낮춤
      - 기획부터 릴리즈까지의 맥락을 쌓아 사람이 바뀌어도 이어지는 제품 개발 체계를 운영
    forbidden_copy:
      - feature lead time·커뮤니케이션 시간·인수인계 기간의 정확한 감소 수치
      - 인원 N명 대체·인력 감축·headcount 절감
      - 회사 전체 개발 프로세스를 단독 설계·구축
      - AI가 제품 판단·디자인·architecture·QA·release를 자율 수행
      - 이 체계가 QA 총건수 감소나 구독 매출을 직접 만들었다는 단독 인과
      - 검증되지 않은 생산성 배수
    verified_at: 2026-08-26
    note: >-
      반복 조율·인수인계·lead time 결과는 2026-08-26 user-confirmed 정성 outcome이다.
      QA reopen 관측과 Thready 구독료 매출은 별도 claim이 소유하며 이 claim의 직접 결과로 합치지 않는다.

  - id: mediness.company-work-ax-design
    statement: 제품 개발 흐름과 의사결정·회의·업무 배정·승인·후속 작업을 agent-readable context·tool·human gate로 연결하는 회사 AX 전환 업무 구조 설계에 참여
    strength: contributed
    confidence: medium
    public: true
    evidence: [evidence/projects/mediness.md#company-work-ax-design]
    allowed_copy:
      - 제품 개발과 회사 업무를 agent가 읽을 수 있는 맥락·도구·사람의 승인 경계로 연결하는 AX 구조 설계에 참여
      - 의사결정·회의·업무 배정·승인·후속 작업을 같은 실행 맥락으로 연결하는 회사 AX 전환 설계에 참여
      - 제품 Decision→release 운영에서 쌓이는 맥락을 회사 업무 AX로 확장하는 구조 설계에 참여
    forbidden_copy:
      - MEDINESS 서비스 또는 platform 직접 구현
      - 회사 AX 전환 완료
      - 전사 업무를 하나의 시스템으로 완전 통합
      - AI가 의사결정·업무 배정·승인·release를 자율 수행
      - 회사 업무 자동화 전체를 단독 설계·구축
      - 검증되지 않은 생산성·회의 시간·승인 속도·release lead time 개선
    verified_at: 2026-08-21

  - id: mediness.slack-issue-intake-flow-proposal
    statement: Slack에서 제기된 사내 이슈를 MEDINESS에 적재하고 해결 상태를 추적하는 업무 흐름을 제안했으며 실제 연동 구현은 다른 담당자가 수행
    strength: contributed
    confidence: medium
    public: true
    evidence: [evidence/projects/mediness.md#slack-issue-intake-flow-proposal]
    allowed_copy:
      - Slack에서 접수한 이슈를 사내 시스템에 남기고 해결 상태를 추적하는 흐름을 제안
      - Slack 이슈 접수와 사내 시스템의 해결 상태 추적을 연결하는 업무 흐름을 제안하고 실제 연동 구현은 다른 담당자가 수행
    forbidden_copy:
      - Slack Bot 직접 구축 또는 운영
      - Slack 연동 직접 구현
      - 사내 이슈 자동화 시스템 구축
      - 개인 Slack 연동 경험을 회사 업무로 표현
    verified_at: 2026-08-30

  - id: mediness.daily-briefing
    statement: MEDINESS에는 협업 도구 활동을 집계하는 daily briefing workflow가 존재하나 김대정의 직접 구축·운영 ownership은 미확인
    strength: contributed
    confidence: low
    public: false
    evidence: [evidence/projects/mediness.md#daily-briefing-ownership-reverification]
    allowed_copy: []
    forbidden_copy:
      - daily briefing agent 직접 구축
      - daily briefing agent 운영
      - 협업 도구 활동 집계와 blocker triage를 지원하는 daily briefing agent 구축·운영
      - 내부 제품 수치
      - 사람의 운영 업무 완전 자동화
    verified_at: 2026-08-18
  - id: mediness.quality-evidence-harness
    statement: 기획·정책 요구사항을 REQ로 쪼개고 evidence로 닫는 전 제품 공통 QA 판정 규칙(PASS/FAIL/UNKNOWN, 실행 성공과 품질 판정 분리)을 QA 팀원 한 명의 서포트를 받아 설계·문서화하고 QA 팀의 AI QA 에이전트 파이프라인의 판정 layer로 연결
    strength: led
    confidence: high
    public: true
    evidence: [evidence/projects/mediness.md#quality-evidence-harness-and-ai-qa-team]
    allowed_copy:
      - 요구사항을 REQ로 쪼개 evidence로 닫는 공통 QA 판정 규칙(PASS/FAIL/UNKNOWN) 설계
      - 실행 성공만으로 PASS 처리하지 않고, AI 기능은 응답 생성과 품질 기준 만족을 분리해 판정
      - QA 팀의 AI QA 에이전트 파이프라인(시나리오→TC→자동화→버그 등록)의 판정 layer로 연결
      - 백그라운드 작업 고장 모드 카탈로그와 fault-injection QA 설계 제안
      - QA 팀원의 서포트를 받아 QA 판정 규칙을 구축
    forbidden_copy:
      - QA AI 에이전트 플러그인 직접 구현·유지
      - 혼자 구축 / QA 팀원 이름·직급 노출
      - QA 조직 총괄
      - Thready adoption·fault-injection 적용 완료 표현 (backlog/proposed)
      - 결함 감소·QA 시간 단축 수치
    verified_at: 2026-09-03
  - id: mediness.ai-qa-team-operation
    statement: QA 팀과 함께 QA 과정을 하네스화한 뒤 그 위에서 AI QA 에이전트 팀 운영에 참여
    strength: contributed
    confidence: medium
    public: true
    evidence: [evidence/projects/mediness.md#quality-evidence-harness-and-ai-qa-team]
    allowed_copy:
      - QA 팀과 함께 QA 과정을 하네스화하고 AI QA 에이전트 팀 운영에 참여
    forbidden_copy:
      - AI QA 팀 단독 운영·총괄
      - 플러그인 구축
    verified_at: 2026-09-03

