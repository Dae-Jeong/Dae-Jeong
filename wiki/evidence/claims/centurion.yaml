  - id: centurion.async-migration
    statement: async FastAPI 실행 모델과의 정합성을 위해 BAY backend의 Celery 기반 비동기 처리를 TaskIQ + RabbitMQ로 전환하고 알림 상태·retry·실패 기록·재처리 경계를 재구성
    strength: led
    confidence: high
    public: true
    evidence: [evidence/projects/centurion.md#bay-async-backend]
    allowed_copy:
      - 비동기 작업 시스템을 Celery에서 TaskIQ + RabbitMQ로 전환
      - async FastAPI 코드베이스와 worker 실행 모델의 정합성을 기준으로 TaskIQ 선택
      - 알림 발송 책임을 별도 domain·service·worker 경계로 재구성
      - 상태·retry·실패 기록·수동 재발송 경계를 운영 흐름으로 연결
      - 워커 이미지를 분리해 배포 단위를 나눔
    forbidden_copy:
      - 전환으로 인한 성능·지연 개선 수치 (측정값 없음)
      - 시스템 복잡도 감소 정량 표현 (측정값 없음)
      - TaskIQ가 비동기 분리 자체를 최초 도입했다는 서술
      - Celery가 비동기 작업 분배 자체를 지원하지 않았다는 서술
    verified_at: 2026-08-16
    note: >-
      2026-08-09 Git history 실측으로 Celery→TaskIQ 전환을 검증했다.
      2026-08-16 TaskIQ 도입 직전 revision의 Celery task와 API queue 호출을 추가 확인해,
      "TaskIQ가 비동기 분리를 최초 도입했다"는 해석을 superseded 처리했다.
      같은 날 user-confirmed 결정 근거와 dependency를 대조해 async FastAPI 실행 모델과의 정합성을
      TaskIQ 선택 이유로 확정했다. workspace:BAY-BE-API —
      "feat: 대규모 시스템 리팩토링 - Notification/Celery 제거 및 Alimtalk/TaskIQ 마이그레이션"(2025-09-14),
      "Remove/notification celery #304"(2025-09-15), TaskIQ 1~3차 구성(2025-09-08~09),
      "fix: taskIQ 재고 차감 처리 오류 시, retry 로직 추가"(2025-10-01). 전부 KimMarin 명의.
