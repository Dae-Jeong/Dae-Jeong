  - id: centurion.say-realtime-ai
    statement: SAY realtime AI 상담 backend의 session lifecycle, VAD speech event, DELTA·COMPLETE·CORRECTED 전사 흐름, domain-keyword early trigger와 provider evaluation 경계 공동 주 기여
    strength: co-led
    confidence: high
    public: true
    evidence: [evidence/projects/centurion.md#say-realtime-ai]
    allowed_copy:
      - realtime AI 상담 backend의 세션 lifecycle과 provider 경계 안정화 공동 주 기여
      - WebSocket session의 중복 event를 task cancellation·debounce·retry·turn-state guard로 제어
      - realtime STT가 내보내는 VAD speech event·DELTA·COMPLETE를 분기하고, DELTA는 domain keyword 우선 판정에, COMPLETE는 context 판단·저장에 사용
      - DELTA·COMPLETE·optional CORRECTED를 같은 sequence로 연결해 늦게 도착한 보정 결과가 다른 turn을 덮어쓰지 않도록 구성
      - COMPLETE 뒤 비동기로 도착하는 CORRECTED를 sequence 기반 Map에 반영해 같은 문장이 반복돼도 정확한 발화만 교체
      - provider 후보에 383개 domain keyword hint를 적용하고 WER·CER·keyword retention·latency benchmark 구축
      - VAD silence 200·350·500ms E2E에서 주 병목이 모델 추론임을 확인해 DELTA 조기 trigger와 provider 경계 분리에 집중
      - 4분 37초 상담 E2E에서 DELTA 586건·COMPLETE 25건·ADVICE 14건과 sequence 1–25의 누락·중복 없음을 확인
      - 종료 뒤 재연결되던 session의 timer·GC·shutdown 정리 경계를 보강하고 13개 focused regression scenario로 고정
      - 외부 실시간 음성 모델의 세션이 발화 중간에 끊겨 전사가 멈추는 문제를, 20초 window·10초 stagger로 겹치는 세션 3개를 병렬로 열고 세션별 버퍼로 순서를 보장해 우회 (led)
      - 우회책의 비용 증가(동시 3세션)와 실시간성 손실을 문서로 남기고, 모델 교체로 문제가 해소된 뒤 레거시 provider를 제거
      - 약 1분 시점 응답 중단의 원인 하나가 자체 60초 재연결 타이머의 경합이었음을 찾아 제거
    forbidden_copy:
      - provider 실명
      - 모델 실명
      - 우회책으로 STT 품질이 개선됐다는 전후 수치
      - 30초 간격 (코드 값은 10초 stagger·20초 window)
      - 상담 backend 전체 단독 구축
      - asyncio 전반의 심화 전문성
      - VAD 또는 keyword weighting으로 STT 정확도를 개선했다는 단정
      - SAY에 keyword별 numeric weight를 구현
      - AI 답변 token streaming 또는 advice.delta 구현
      - 대안 STT adapter를 production에 전환하거나 현재 운영 중
      - 4분 37초 E2E event 수치를 STT 정확도·지연 개선 수치로 해석
      - VAD tuning으로 전체 지연 또는 STT 정확도를 개선했다고 단정
    verified_at: 2026-08-21
