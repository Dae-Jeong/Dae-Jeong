  - id: career.sellercanvas-product-system
    statement: 생성형 AI 커머스 콘텐츠 제품 SellerCanvas에서 PM 메인 롤로 제품이 원활하게 돌아가는 시스템을 기획·구축
    strength: led
    confidence: high
    public: true
    evidence: [evidence/projects/previous-career.md#studio-lab-and-sellercanvas]
    allowed_copy:
      - SellerCanvas(생성형 AI 커머스 콘텐츠, CES 2024 최고혁신상 제품)의 PM 메인 역할로 제품 시스템 기획·구축
      - LLM 붐 이전부터 Vision AI 기반 생성 제품의 제품 시스템을 기획·구축
      - 프로토타입 단계에서 v1.0 제품까지 0→1 구간을 PM으로 통과
      - 무엇을 만들지 정하는 일부터 제품이 굴러가는 구조를 세우는 일까지 담당
    forbidden_copy:
      - 제품 전체 단독 기획·총괄
      - 창업자·설립 시점부터 참여 (합류 시점은 2021.12, AI Engineer다)
      - 0에서 혼자 만들었다는 표현 (프로토타입이 선행했고 PM은 2022.10부터다)
      - 매출·전환율 등 미검증 수치
      - 특허 단독 발명 표현
    verified_at: 2026-08-12
    note: >-
      2026-08-12 user-confirmed: "셀러캔버스라는 시스템을 내가 처음부터 기획했고 zero to one을
      경험하는 과정을 거쳤다". 0→1 표현을 해금하되 단독·총괄 표현 금지는 유지한다 —
      합류 시점(2021.12)에 프로토타입이 존재했고 PM 전환은 2022.10이다.
      "0→1 구간을 PM으로 통과"가 사실과 강도 양쪽을 만족하는 표현이다.
    note: >-
      2026-08-12 user-confirmed: 특허 「페이지 출력 방법」은 SellerCanvas 상세페이지
      작업에서 나온 것이 맞다 — "특허와 SellerCanvas의 연결 (확정 전)" 금지를 해제한다.
      구버전 원티드 이력서의 "[PM] 상세페이지 제작 관련 특허 출원" 자기 기록과 정합.
      단독 발명 표현 금지는 유지.
