    verified_at: null
    note: >-
      User-confirmed (2026-08-08): 인증 통과 사실만 쓰고 정확도 수치와 사용 기술은 쓰지 않는다.
      User-confirmed (2026-08-09): 기관명을 한국건설생활환경시험연구원(KCL)로 정정.
      플랫폼 원문은 "한국건설환경시험연구원"으로 한 글자가 빠져 있었다.

      medisolve-admin.* 는 같은 self-reported 근거로 low/public:false 로 강등했으나 이 claim 은
      medium/public:true 를 유지한다. 근거가 다르기 때문이다 —
      (1) strength 가 contributed 다. "내가 전담했다"는 ownership 주장이 아니라 "외부 기관이 인증했다"는
          사실 진술이며, allowed_copy 도 인증 통과 사실 한 줄로 제한된다.
      (2) 기관 정식 명칭을 사용자가 직접 정정할 만큼 기억이 구체적이다 (KCL).
      (3) forbidden_copy 로 수치·모델·단독 표현을 차단해 과장 여지를 없앴다.
      반면 medisolve-admin 은 owned 강도와 결과형 수치를 함께 주장해 검증 없이는 방어할 수 없었다.

      다만 인증서·시험성적서 실물은 여전히 미확인이다. 확인 시 confidence high 및 verified_at 기입.
