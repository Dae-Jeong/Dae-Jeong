schema_version: 1
project: infrastructure
claims:
  - id: infra.company-azure-ownership
    statement: MediSolve AI의 여러 사내 서비스가 동작하도록 Azure·Vercel 배포 환경을 구성하고 기본 운영을 담당
    strength: owned
    confidence: high
    public: true
    evidence: [evidence/projects/infrastructure.md#company-azure-ownership]
    allowed_copy:
      - 여러 사내 서비스의 Azure·Vercel 배포 환경 구성과 기본 운영 담당
      - Docker·GitHub Actions·Azure·Terraform을 활용한 서비스 배포·환경 설정·기본 로그 확인 경험
    forbidden_copy:
      - 모든 Azure resource를 최초부터 단독 생성
      - 회사 전체 infrastructure architecture를 단독 설계
      - infrastructure specialist·cloud architect 수준의 전문성 주장
      - 고가용성·network·security architecture 전문성 주장
      - 정확한 고객·resource·cost·security detail
    verified_at: 2026-07-11
  - id: infra.workload-runtime-topology
    statement: 기존 Shared·B2B·B2C Azure resource를 제품군·환경별 monorepo root/state로 통합하고 shared ACR, workload별 App Service·VM runtime, managed data, 환경별 observability로 구성된 현재 topology와 변경 체계를 운영
    strength: contributed
    confidence: high
    public: true
    evidence: [evidence/projects/infrastructure.md#workload-aligned-runtime-topology]
    allowed_copy:
      - B2B는 App Service Gateway·환경별 VNet의 Docker workload·managed data로, B2C는 managed App Service·별도 VM workload·managed data로 실행 경계 구성
      - 제품군·환경은 분리하고 shared ACR와 환경별 Azure Monitor·Log Analytics를 공통 운영 방식으로 관리
      - 기존 Shared·B2B·B2C resource를 제품군·환경별 root/state로 통합하고 현재 runtime topology와 변경 체계 운영
    forbidden_copy:
      - 현재 topology의 모든 component를 최초부터 단독 설계·생성
      - 모든 B2B·B2C data가 private network 안에 있다는 주장
      - Hub-Spoke·Azure Container Apps·Tailscale·Key Vault 통합·GitHub OIDC를 현재 구현으로 표현
      - Front Door·WAF·APIM·Load Balancer 등 확인되지 않은 component 추가
      - 정확한 고객·resource group·domain·state key·network·security configuration 공개
      - core 6-root monorepo 지도를 별도 project IaC까지 포함한 회사 전체 topology로 표현
    verified_at: 2026-08-20
  - id: infra.ai-assisted-change-harness
    statement: 회사 전체 Azure infrastructure를 전담하며 AI를 resource inventory·Terraform 구현에 활용하고 state·plan·live inventory·post-apply 확인으로 변경을 통제하는 운영 harness 설계
    strength: contributed
    confidence: medium
    public: true
    evidence: [evidence/projects/infrastructure.md#ai-assisted-infrastructure-harness]
    allowed_copy:
      - 회사 전체 서비스의 Azure infrastructure를 전담하고 한 사람이 관리 가능한 변경·운영 체계로 설계
      - AI를 resource inventory와 Terraform 구현에 활용하되 state·plan·live inventory 검증 뒤 apply
      - 현재 workload 복잡도에 맞는 Azure managed runtime을 활용해 platform 운영 부담을 제한
    forbidden_copy:
      - AI가 infrastructure architecture·apply를 자율적으로 결정
      - 모든 infrastructure 변경이 완전 자동화됨
      - 특정 orchestration technology보다 우월하거나 영구히 불필요하다는 주장
      - 모든 application이 별도 검증 없이 다른 runtime으로 즉시 이전 가능
    verified_at: 2026-08-19
    note: >-
      AI 활용과 managed runtime 선택 rationale은 user-confirmed라 confidence medium이다.
      state·plan·live inventory gate와 운영 규모는 별도 high-confidence claim이 소유한다.
  - id: infra.terraform-state-safety
    statement: 회사 Azure Terraform을 6개 독립 root·remote state와 400+ state object로 운영하고 state·plan·live inventory 교차 검증으로 destructive drift를 apply 전에 차단
    strength: owned
    confidence: high
    public: true
    evidence: [evidence/projects/infrastructure.md#terraform-state-and-drift-safety]
    allowed_copy:
      - Shared·STG·Prod 기준 6개 독립 Terraform root·remote state와 400+ state object 운영
      - state snapshot·Terraform plan·Azure live inventory를 교차 검증하는 apply gate 운영
      - 의도하지 않은 destroy·replace와 환경 간 변경 전파를 apply 전에 차단
    forbidden_copy:
      - 모든 Azure resource를 최초부터 단독 생성
      - 모든 resource가 Terraform으로 완전 관리됨
      - drift 0건·destructive change 0건 보장
      - 완전 자동화된 CI/CD·무인 apply
      - NEXUS replacement plan을 실제 apply
    verified_at: 2026-08-18
  - id: infra.azure-observability
    statement: Azure Monitor·환경별 Log Analytics와 AMA/DCR로 구성된 10대 VM log 수집과 8개 Production alert의 현재 Terraform 구성·운영 범위 담당
    strength: contributed
    confidence: high
    public: true
    evidence: [evidence/projects/infrastructure.md#production-observability]
    allowed_copy:
      - Azure Monitor·환경별 Log Analytics와 AMA/DCR로 구성된 10대 VM container log 수집 범위 운영
      - CPU·memory·disk·API health/5xx·DB availability/storage/failed connection을 포함한 8개 Production alert의 Terraform 구성·운영
    forbidden_copy:
      - 가용성 99.9% 달성
      - MTTR·장애율 개선 수치
      - 모든 workload log 완전 수집
      - WebSocket workload 전체 coverage
      - 10대 VM log·8개 alert 전체를 최초부터 단독 구축
    verified_at: 2026-08-18
