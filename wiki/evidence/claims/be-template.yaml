  - id: be-template.fastapi-sqlalchemy-standard
    statement: FastAPI·SQLAlchemy 2.0 async 기반 계층 구조와 @transactional·ContextVar·SessionProxy 기반 transaction/session 경계를 조직 표준 backend template으로 설계·구축
    strength: owned
    confidence: high
    public: true
    evidence: [evidence/projects/be-template.md#fastapi-sqlalchemy-standard]
    allowed_copy:
      - FastAPI·SQLAlchemy 2.0 async 기반 조직 표준 backend template 설계·구축
      - Router·Service·Validator·Repository·Model 계층과 DI를 조직 backend 기준으로 구현
      - Repository의 SQL 실행과 Service transaction 경계를 분리하고 async session lifecycle을 integration test로 검증
      - "@transactional로 REQUIRED의 기존 transaction 참여, REQUIRES_NEW의 새 connection·AsyncSession, NESTED의 SAVEPOINT를 구현"
      - ContextVar에 AsyncSession·TxState를 bind하고 SessionProxy로 현재 session을 resolve해 반복적인 session 인자를 제거
      - Router에서 받은 session을 모든 계층에 전달하는 반복을 없애고 Service method가 transaction policy를 선언하도록 구성
      - owner-task guard로 child task의 session 상속 접근을 차단하고 CancelledError rollback·connection cleanup을 integration test로 검증
      - 하나의 transaction은 하나의 asyncio task와 AsyncSession이 소유하도록 동일 session의 child-task 접근을 fail-fast
      - 병렬 DB 작업은 task별 transaction·데이터 가시성·실패 복구·connection 비용을 먼저 결정하도록 ADR·runbook에 규칙화
      - generic Repository와 typed query DTO로 ORM·raw query 데이터 접근 경계를 표준화
    forbidden_copy:
      - 조직의 모든 backend 표준 단독 결정
      - 모든 사내 service가 같은 template으로 전환 완료
      - 성능·결함·개발 시간의 정량 개선
      - Depends(get_session)이 잘못된 방식이거나 FastAPI의 한계라는 주장
      - ContextVar에 raw DB connection을 저장했다는 주장
      - NESTED를 독립 transaction으로 표현
      - child task가 같은 AsyncSession을 안전하게 공유한다는 주장
      - 요청 간 동시성이나 transaction 밖의 외부 I/O까지 직렬화했다는 주장
    verified_at: 2026-08-28
  - id: be-template.team-leverage
    statement: 백엔드 경험이 적은 기획·QA·디자인 담당자도 coding agent와 표준 template을 기반으로 운영 제품의 기능을 구현하도록 명시적 계층·의존성·transaction·검증 규칙을 기본값으로 제공
    strength: owned
    confidence: high
    public: true
    evidence: [evidence/projects/be-template.md#team-leverage-context]
    allowed_copy:
      - 소수 백엔드 인원이 다수 제품을 담당하는 체제에서 어떤 프로젝트든 정책 파악만으로 대응 가능하게 함
      - 10명 안팎의 엔지니어 조직에서 2~3명의 백엔드 엔지니어가 다수 제품을 담당하는 환경
      - logging·모니터링 등 횡단 관심사를 전 제품에 일괄 반영
      - 기획·QA·디자인 담당자가 coding agent로 사내 프로그램을 구현할 때도 같은 backend pattern·검증 규칙을 적용
      - 여러 직군이 coding agent로 구현에 참여해도 Layered Architecture·Service Layer·Repository Pattern·DI와 transaction 규칙을 공통 기본값으로 사용
      - Python의 자유도를 프로젝트마다 다시 해석하지 않도록 Java/Spring에서 익숙한 명시적 책임·호출 규칙을 FastAPI template에 적용
      - 백엔드 경험이 적은 담당자도 coding agent와 FastAPI template을 기반으로 기능을 구현하고 운영 제품을 만들 수 있도록 지원
      - 기능 구현은 각 담당자가 수행하고 template 설계자는 구현 결과에 대한 피드백과 배포를 지원
      - 공통 template으로 담당자별 제품 개발 속도와 결과물 품질의 편차를 줄여 일정 수준을 유지하도록 지원
      - 정기 개발팀 회의에서 template 설계 구조를 검토하고 받은 피드백을 실제 구현에 반영
      - transaction·DB session lifecycle·책임별 folder 구조·API request·response contract를 백엔드 경험이 적은 담당자도 따를 수 있는 기본값으로 제공
      - session 관리와 transaction 경계를 template에 내장해 session 미반납에 따른 connection pool 고갈과 반복 500 오류의 발생 가능성을 낮춤
      - Service method가 @transactional로 정책을 선언하고 Repository가 ContextVar에 bind된 현재 AsyncSession을 resolve하도록 해 기능 구현 담당자와 coding agent가 session lifecycle을 매번 직접 관리하지 않게 함
      - STG에서 반복되던 session·connection pool 오류와 backend 담당자의 상시 개입을 줄이고 기능 담당자가 구현한 결과를 피드백한 뒤 배포하는 수준으로 지원 범위를 좁힘
      - local 구현에서 드러나지 않던 session·connection 문제를 STG QA ticket의 원인 분석에서 확인하고 template의 기본 session 경계로 보완
      - 신규 사내 프로그램은 full template으로 시작하고 기존 제품은 DB session 관리부터 점진적으로 도입
      - session·transaction·API contract는 공통 기본값으로 두고 AI Agent 기능은 Hexagonal Architecture, 나머지는 MVC를 기본 구조로 guide
      - Tool이 늘어나는 AI Agent 기능은 application logic과 tool·provider 구현을 port·adapter로 분리해 capability 확장과 adapter 교체에 대응하도록 Hexagonal Architecture를 기본값으로 선택
      - 초기 제품은 운영 가능한 구조·가독성·안전성을 먼저 확보하고 성공 이후 추가 고도화한다는 원칙을 세움
      - Full template으로 시작한 신규 사내 프로그램의 STG QA에서 이전의 session 미반납·connection pool 고갈 문제가 재관측되지 않음
      - 책임별 folder·layer·호출 규칙을 고정해 coding agent가 만든 로직·logging·local import가 흩어지는 문제를 줄이고 문제 영역을 찾기 쉽게 함
    forbidden_copy:
      - 정확한 내부 제품 수와 인원 구성
      - 기획·QA·디자인 담당자가 만든 사내 프로그램의 정확한 수와 제품명
      - 새 프로젝트 비용의 정량 감소 주장
      - Java/Spring으로 해당 backend를 구현했다는 주장
      - 기능 구현에 별도 피드백이나 배포 지원이 전혀 필요하지 않았다는 주장
      - 전사 승인 또는 회사 전체 backend 전환 완료
      - 제품 개발 속도·품질·결함 수의 정확한 개선 수치
      - connection pool 고갈을 DB deadlock으로 표현
      - DB session·500 오류를 완전히 제거했다는 주장
      - production incident·운영 장애를 줄였다는 주장
      - Backend 지원이 완전히 필요 없어졌다는 주장
      - Backend 지원 시간·질문 건수의 정확한 감소 수치
      - QA ticket 자동 분류 또는 local 단계 connection 문제 자동 탐지
      - 모든 기존 제품의 full template 전환 완료
      - 모든 제품에 하나의 architecture pattern을 강제했다는 주장
      - MVC가 본질적으로 Agent 구현에 부적합하거나 순환 참조를 만든다는 주장
      - Hexagonal Architecture가 결합·순환 의존 문제를 자동으로 제거한다는 주장
      - "`70~80점`을 측정된 품질 점수로 사용"
      - Template이 모든 DB 오류나 production incident를 방지한다는 주장
      - 성공한 제품의 architecture를 실제로 고도화했다는 주장
      - 디버깅 시간의 정확한 감소 수치
    verified_at: 2026-08-31
