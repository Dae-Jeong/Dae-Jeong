      - v1.3.0부터 실제 사용자가 쓰는 AI 콘텐츠 제품의 backend를 구축·운영
    forbidden_copy:
      - Thready를 0부터 혼자 구축
      - frontend 포함 제품 전체 0→1을 단독 주도
      - v1.0부터 실제 사용자 운영
      - AI 기능을 처음부터 0→1로 구축
