  - id: thready.threads-content-workflow-automation
    statement: Threads 글 작성에서 사람이 반복하던 참고 자료 가져오기·정리, 초안 생성, 1차 검수, 예약·발행 준비를 하나의 제품 흐름으로 연결하고 최종 수정·예약·발행 판단은 사람이 맡도록 구성
