    allowed_copy:
      - 월 수만 건 규모 요청을 처리하는 production backend를 HTTP 5xx 0.3% 수준으로 운영
      - production backend를 성공률 99.7% 이상으로 운영
    forbidden_copy:
      - 정확한 요청 수·오류율·traffic 수치
      - 무중단 운영 보장
      - 전후 비교 기반 개선 배수
    verified_at: 2026-07-16
  - id: thready.release-operation
    statement: backend cutover 이후 release, QA, task 구조를 통한 개발·운영 수행
    strength: owned
    confidence: high
    public: true
    evidence: [evidence/projects/thready.md#release-operation]
    allowed_copy:
      - release·QA·task 구조 기반 backend 운영
    forbidden_copy:
      - 무중단 운영 보장
    verified_at: 2026-07-05
  - id: thready.rebuild-decision-execution
    statement: 서비스 초기 시점 판단으로 전면 재구축을 결정·설득하고, 하네스 세팅 후 AI 협업으로 파악·기능 정의·재구축을 총 36시간(작업 시간)에 완수
    strength: owned
    confidence: high
    public: true
    evidence: [evidence/projects/thready.md#rebuild-context-and-decision]
    allowed_copy:
      - 서비스가 작은 시점에 전면 재구축을 결정하고 반대를 설득 — 하네스를 먼저 세팅하고 AI와 협업해 파악부터 재구축까지 총 36시간(작업 시간 기준)에 완수
      - AI 모듈 확장을 근거로 FastAPI 분리 도입, FE는 Next.js 유지
    forbidden_copy:
      - 36시간 만에 서비스 전체 완성 (달력 기간 오독 표현)
      - 전임 작업 폄하 표현
    verified_at: 2026-07-19
  - id: thready.qa-reopen-reduction
    statement: backend cutover 이후 QA 버그 재발률(해결 대비 reopen)이 37%에서 11%로 하락, 재발 발생 일평균 약 94% 감소 (Jira 236건 실측)
    strength: owned
    confidence: high
    public: true
    evidence: [evidence/projects/thready.md#qa-reopen-signal]
    allowed_copy:
      - QA 버그 재발률(해결 대비 reopen)을 37%에서 11%로 낮춤
      - 재발(reopen) 발생 일평균 약 94% 감소
      - QA 티켓 reopen(재발) 전환율 대폭 감소
      - 잔여 이슈도 원인 영역이 파악된 상태로 관리
    forbidden_copy:
      - 95% 이상 감소 (실측 94.1% 초과 표현)
      - 재발 완전 제거
      - backend 단독 효과로 단정 (BE/FE 분리 불가)
    verified_at: 2026-07-19
  - id: thready.quality-criteria-system
    statement: AI 글 생성 품질 판정을 3층(자동 게이트·실측 분포 대조·사람 판정)으로 분리하고 6축으로 계량화, 자동화가 닿는 층과 닿지 않는 층을 갈라 설계
    strength: owned
    confidence: high
    public: true
    evidence: [evidence/projects/thready-quality-lab.md#measurement-architecture]
    allowed_copy:
      - AI 생성 품질을 자동 게이트·실측 분포·사람 판정 3층으로 나눠 계량
      - 자동화가 닿는 층과 닿지 않는 층을 갈라 설계
      - 결정적 게이트 12종으로 형식 오류를 자동 차단
      - 품질 판정 기준을 6축으로 계량하고 축별 개선 순서를 관리
    forbidden_copy:
      - 6축 점수 수치 병기 (자가 채점이므로 외부 검증 지표로 오독됨)
      - 품질 자동 판정 (3층 천장은 사람 판정이다)
      - 생성 품질 개선 배수·비율 (검증되지 않음)
    verified_at: 2026-08-08
  - id: thready.measurement-correction
    statement: 프롬프트 기준값이 자사 출력을 근거로 되먹임하던 순환을 재실측으로 발견하고 문제 축을 재정의해 기준을 재수립
    strength: owned
    confidence: high
    public: true
    evidence: [evidence/projects/thready-quality-lab.md#self-feedback-error]
    allowed_copy:
      - 품질 기준값이 자사 출력을 근거로 되먹임하던 순환을 재실측으로 발견하고 교정
      - 문제 정의 자체를 재검토해 개선 축을 재정의
      - 규칙 추가가 아니라 역할 재정의로 근본 원인을 해소
    forbidden_copy:
      - 구체 수치 병기 (16자/23자 등 내부 측정값)
      - 전임자·타인 오류로 표현 (자체 기준의 순환이었다)
    verified_at: 2026-08-08
  - id: thready.falsification-log
    statement: 반증된 접근을 삭제하지 않고 재시도 금지 로그로 관리해 이후 실험 범위를 좁히는 방식 확립
    strength: owned
    confidence: high
    public: true
    evidence: [evidence/projects/thready-quality-lab.md#falsification-log]
    allowed_copy:
      - 반증된 접근을 기록으로 남겨 재시도를 막는 실험 규율 확립
      - 실패 이력을 다음 실험의 판단 근거로 재사용
      - 자체 규칙도 반증되면 제거하는 검증 절차 운영
    forbidden_copy:
      - 실패 건수·비율 수치화
      - 방법론을 조직 표준으로 확산했다는 표현 (개인 실험 범위)
    verified_at: 2026-08-08
  - id: thready.corpus-measurement
    statement: 자체 수집 실측 코퍼스를 소표본에서 대량 규모로 확대하고 표본 편향을 명시해 이전 결론을 유지/기각으로 재판정
    strength: owned
    confidence: high
    public: true
    evidence: [evidence/projects/thready-quality-lab.md#measurement-scale]
    allowed_copy:
      - 직접 수집한 실측 코퍼스로 프롬프트 규칙의 근거를 검증
      - 표본을 확대해 소표본 결론을 유지/기각으로 재판정
      - 측정마다 표본 편향과 한계를 함께 기록
    forbidden_copy:
      - 플랫폼 전체 통계·대표성 표현 (원 기록이 "통계가 아니라 경향"으로 한정)
      - 제3자 계정·개별 게시물 지표 인용
    verified_at: 2026-08-08
