schema_version: 1
project: thready
claims:
  - id: thready.creator-adoption-context
    statement: 기존 Instagram·YouTube·blog 운영자가 시간 부족과 Threads의 다른 문화·알고리즘 때문에 겪는 진입장벽을 낮추고 지속 운영을 돕는 제품 맥락
    strength: contributed
    confidence: medium
    public: true
    evidence: [evidence/projects/thready.md#creator-customer-problem]
    allowed_copy:
      - 기존 채널 운영자가 시간 부족과 다른 플랫폼 문화 때문에 겪는 Threads 진입장벽을 낮추고 지속 운영을 돕는 콘텐츠 제품
      - 기존 콘텐츠 자산을 활용해 Threads 운영을 이어가려는 고객을 위한 제품
    forbidden_copy:
      - 모든 고객의 동일한 이용 행동
      - 운영 시간 절감률 또는 Threads 알고리즘 역공학
    verified_at: 2026-09-08
    note: 사용자 확인에 근거한 고객 문제·제품 역할이며 기능별 효과 측정은 아니다.
  - id: thready.customer-follower-growth
    statement: Thready 이용 고객 1명이 꾸준히 운영하며 팔로워가 기존 대비 10배 이상 증가한 사례에 대한 사용자 확인
    strength: contributed
    confidence: medium
    public: true
    evidence: [evidence/projects/thready.md#customer-follower-growth]
    allowed_copy:
      - 제품 이용 고객 1명이 꾸준히 운영하며 팔로워가 기존 대비 10배 이상 증가한 사례
      - Threads 지속 운영을 돕는 제품을 만들었고, 이용 고객 중 팔로워가 기존 대비 10배 이상 늘어난 사례가 있음
    forbidden_copy:
      - 모든 고객 또는 평균 팔로워 10배 성장
      - 특정 기능이나 개인 구현만으로 팔로워를 10배 늘렸다는 직접 인과
      - 측정 기간·전후 원시 팔로워 수의 추정
      - 신규 자동 생성·추천·재구축 효과로 소급 연결
      - 성장 보장 또는 재현 가능한 성장률
    verified_at: 2026-09-08
    note: 사용자 확인이며 운영 데이터는 미조회. 기간·원시 수치·사용 기능·광고 등 다른 영향은 미확인이고 제품·팀 outcome으로만 사용한다.
  - id: thready.auto-generation-approval-flow
    statement: 시간표에 따른 소재 선택·AI 접수·초안 채택·목표 시각 승인 알림을 연결하고 슬롯 및 생성·알림 원장으로 중복 편성 경계를 구현
    strength: led
    confidence: high
    public: true
    evidence: [evidence/projects/thready.md#automatic-generation-and-approval-flow]
    allowed_copy:
      - 시간표에 맞춰 초안을 생성하고 고객이 알림에서 수정·예약·발행을 결정하는 흐름 구현
      - 생성과 알림 상태를 분리하고 슬롯별 원장과 transaction으로 중복 편성을 통제
    forbidden_copy:
      - 사람 확인 없는 자동 발행
      - 해당 기능의 production 고객 사용 또는 시간 절감량 확정
      - 전체 운영의 exactly-once 또는 완료 보장
      - 해당 기능이 구독 매출·팔로워 증가를 만들었다는 인과
    verified_at: 2026-09-08
  - id: thready.youtube-source-reuse
    statement: 기존 YouTube 채널 소재를 정기 동기화하고 소유권·성공 소비 이력을 기준으로 Threads 생성에 활용하며 소재 고갈 시 재사용을 중단하는 경계 구현
    strength: led
    confidence: high
    public: true
    evidence: [evidence/projects/thready.md#youtube-source-reuse]
    allowed_copy:
      - 기존 YouTube 채널 소재를 정기 동기화해 Threads 제작에 활용하고 성공적으로 쓴 소재는 계정별로 제외
      - 채널 조회와 DB 반영을 분리하고 채널별 실패 격리·내부 상태 보존·소재 고갈 시 중단 경계 구현
    forbidden_copy:
      - 모든 외부 채널의 자동 소재 탐색 또는 production Scouter 구현
      - 모든 동시 요청이나 의미상 유사 글의 중복 제거 보장
      - 운영 시간·성장률 개선 실측
    verified_at: 2026-09-08
  - id: thready.publish-recovery-boundary
    statement: 외부 발행 호출 전 실패와 호출 후 결과 불명을 구별하고 기존 container·reply 실행 이력으로 재개하며 job·콘텐츠·실패 알림의 종결을 원자화하는 경계 구현
    strength: led
    confidence: high
    public: true
    evidence: [evidence/projects/thready.md#publishing-recovery-boundary]
    allowed_copy:
      - 외부 발행 전 실패와 발행 결과가 불명인 경우를 구별하고 기존 발행 시도를 이어가는 복구 경계 구현
      - 이미 발행된 이어쓰기를 건너뛰고 작업·콘텐츠·실패 알림을 같은 transaction으로 종결
      - lease와 attempt token으로 재점유와 오래된 worker의 상태 덮어쓰기를 통제
    forbidden_copy:
      - 외부 exactly-once 또는 중복 게시 0건 보장
      - 장애·문의·복구 시간 감소 수치
      - 모든 발행의 완료 보장
    verified_at: 2026-09-08
  - id: thready.approval-command-consistency
    statement: 고객의 수정 revision·승인 결정·예약/발행 job을 한 transaction으로 확정하고 command ID·payload fingerprint와 만료 상속으로 재전송·세션 경계를 구현
    strength: led
    confidence: high
    public: true
    evidence: [evidence/projects/thready.md#approval-command-consistency]
    allowed_copy:
      - 고객의 수정본과 승인·예약·발행 결정을 함께 저장하고 같은 명령 재전송은 기존 결과로 처리
      - 승인 링크로 발급한 세션이 갱신 후에도 원래 만료 시각을 넘지 않도록 구현
    forbidden_copy:
      - 인증 체계 전체 단독 구축
      - 보안 사고·중복 발행 감소 실측
      - 해당 기능의 고객 이용·시간 절감량 확정
    verified_at: 2026-09-08
  - id: thready.backend-rebuild
