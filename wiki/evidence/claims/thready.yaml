      - 사람이 반복하던 Threads 콘텐츠 제작 업무를 자료 정리 → 초안 생성 → 1차 검수 → 예약·발행 준비의 제품 흐름으로 연결
      - 콘텐츠 운영을 Scout·Friend·Creator·Guard 역할로 나눠 설계하고, 콘텐츠 가져오기·생성·검수 흐름을 직접 구현
