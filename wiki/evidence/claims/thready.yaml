    note: "2026-09-08 표현 선택: 합류 경위는 evidence에 보존하되 공개 도입부는 backend 전환·개발·운영 책임으로 쓴다. 최초 prototype 작성 이력을 정정하는 것은 아니다."
    strength: led
    confidence: high
    public: true
    evidence: [evidence/projects/thready.md#prototype-to-user-operation]
    allowed_copy:
