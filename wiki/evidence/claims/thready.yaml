  - id: thready.product-zero-to-one-contribution
    statement: Thready 제품 아이디어를 제안하고, 다른 engineer가 구현한 초기 prototype 이후 PO 역할로 기획·QA·마케팅 담당자와 고객 문제·기능 우선순위·생성 품질 기준·backend·핵심 frontend·data·QA·release·operation을 실제 사용자와 구독료 매출이 발생하는 제품까지 연결하는 0→1 제품화 주도
    strength: led
    confidence: medium
    public: true
    evidence: [evidence/projects/thready.md#product-zero-to-one-contribution]
    allowed_copy:
      - Thready의 아이디어를 제안하고 제품화·출시·운영을 주도했습니다.
      - 아이디어 제안부터 제품화·출시·운영까지 주도하고 백엔드·AI와 핵심 화면을 직접 구현
      - 기획·QA·마케팅과 함께 Thready의 제품 운영·관리를 리드
      - PO 역할로 Thready의 고객 문제 정의·기능 우선순위·품질 기준·QA·release·production operation을 연결하는 제품 운영 주도
      - Thready의 제품 운영을 리드하고, 제품 판단을 backend·핵심 frontend·data·AI 생성·평가 system으로 직접 구현
      - Thready의 0→1 제품화와 backend 구축·운영 주도
      - 고객의 콘텐츠 제작 문제를 market data 기반 생성·평가 기능과 backend system으로 구체화
      - 문제 정의부터 기술 구현·운영까지 맡아 실제 사용자와 구독료 매출이 발생하는 제품에 상당 부분 기여
    forbidden_copy:
      - PO가 공식 등재 직함이라고 단정
      - 인계받은 제품·초기 프로토타입 이후 합류를 공개 성과의 도입부로 반복하는 표현 (2026-09-08 편집 제외, 사실 부정 아님)
      - Thready를 0부터 혼자 구축
      - 초기 prototype을 직접 구현
      - 아이디어부터 prototype·제품화·매출까지 전 과정을 혼자 만듦
      - 기획·QA·마케팅·design·acquisition 실행을 혼자 담당
      - frontend·design·acquisition을 포함한 제품 전체 단독 ownership
      - 특정 기능 또는 개인이 월 구독료 매출을 직접 만들었다는 단독 인과
      - MRR·ARR·지속 성장·월평균 표현
    verified_at: 2026-08-31
    note: >-
      제품 아이디어 제안, 다른 engineer의 초기 prototype 구현, 이후 cross-functional team과 함께한
      PO 역할의 제품 운영과 제품 0→1 contribution은 user-confirmed라 confidence medium이다.
      고객 결제와 구독료 매출은 제품·팀 outcome이며 개인 또는 특정 기능의 단독 인과가 아니다.
      backend·frontend·data·quality·release의 각 실행 영역은 별도 high-confidence claim이 소유한다.
      2026-09-08 표현 결정은 아이디어 제안·제품화·출시·운영 중심의 선택이며 statement의
      최초 prototype 기여 이력을 변경하거나 제품 전체 최초 구현을 새로 승인한 것이 아니다.
