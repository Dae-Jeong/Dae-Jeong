version: 2
last_updated: 2026-09-01

summary: >
  Portable source-of-truth manifest for Kim Daejeong's profile, evidence,
  resume, portfolio, homepage, agent workflow, writing, and JD analysis.

layers:
  context:
    owns: [routing, current_snapshot]
    canonical: false
  profile:
    owns: [identity, career, tenure, capabilities, credentials, contribution, decision_principles, agent_workflow, writing]
    canonical: true
  evidence:
    owns: [verified_facts, claims, confidence, public_scope, audits, client_masking]
    canonical: true
  products:
    owns: [resume_contracts, portfolio_contracts, homepage_contracts, artifact_mapping, jd_analysis]
    canonical: true
  app:
    owns: [public_site_code, active_public_expression]
    canonical: true
    note: 표현만 소유한다. 사실·claim은 profile/evidence를 따른다.
  rules:
    owns: [document_routing, evidence_policy, public_safety, recency_weighting]
    canonical: true
  backlog:
    owns: [idea_registry, spec_promotion]
    canonical: true
    note: 아이디어당 폴더 + _template.md 기반 README. 착수 확정 시 spec/task로 승격.
  docs:
    owns: [design_specs, plans]
    canonical: true
    note: superpowers spec·plan 문서. 설계 결정의 시점 기록.
  skills:
    owns: [executable_adapters]
    canonical: false
  archive:
    owns: [superseded_history]
    canonical: false

roles:
  profile_curator:
    read: [profile/README.md, evidence/README.md]
    write: [profile/]
  evidence_curator:
    read: [rules/evidence-policy.md, rules/public-safety.md]
    write: [evidence/]
  resume_editor:
    read: [products/resume/README.md, products/resume/content-contract.md, products/site/content-sot.md, products/site/surface-roles.md, profile/, evidence/claims/, app/fe/app/resume/resume-view.tsx]
    write: [products/resume/, app/fe/app/resume/resume-view.tsx]
  portfolio_editor:
    read: [products/portfolio/README.md, evidence/projects/, evidence/claims/]
    write: [products/portfolio/]
  homepage_editor:
    read: [products/homepage/README.md, products/site/content-sot.md, profile/, evidence/claims/, app/fe/app/page.tsx]
    write: [products/homepage/, app/fe/app/page.tsx]
  jd_analyst:
    read: [products/jd/README.md, profile/capabilities.md, evidence/claims/]
    write: [products/jd/]

agents:
  codex:
    entry: AGENTS.md
    first_read: [context/manifest.yaml, context/index.md, context/current-state.md]

document_policy:
  routing_rule: rules/document-routing.md
  evidence_rule: rules/evidence-policy.md
  public_safety_rule: rules/public-safety.md
  local_source_example: config/source-roots.example.yaml
