# 자동 게이트의 데이터. 코드(tools/validate_workspace.py)는 이 파일을 읽어 검사만 한다.
# 각 항목은 wiki/rules/application-copy-standard.md §4 게이트 표의 행과 짝이다. 행이 지워지면 여기도 지운다.
schema_version: 1

# 게이트 32·33 — 현행 문안 선택. 플랫폼·과거 제출본은 별도 동기화/보존 범위다.
copy_selection:
  - gate: 32
    label: Thready 인계·prototype 이후 도입부
    # 조직 Template의 일반 코드 비교는 Thready 합류 서사가 아니다. 동결본도 소비한다.
    excluded_text:
      - "왼쪽은 인계받은 코드에서 반복되던 구조, 오른쪽은 조직 template의 기본값이다."
    common_ids: [resume.common, career.common, portfolio.common, cv.common, cases]
    extra_paths:
      - app/fe/app/portfolio/[case]/system-details.tsx
      - app/fe/app/portfolio/[case]/case-details.tsx
      - app/fe/content/resumes/role-variants.ts
      - app/fe/content/documents/jyp-v2.ts
      - app/fe/content/portfolios/jyp-v2.ts
    patterns:
      - '(?i)인계\s*받|초기\s*(?:prototype|프로토타입|시제품).{0,35}(?:이후|다른)'
      - '(?i)(?:prototype|프로토타입|시제품)\s*이후\s*(?:제품화|합류|Backend)'
  - gate: 33
    label: Thready QA 감소율 성과 비선택
    common_ids: [resume.common, career.common, portfolio.common, cv.common]
    extra_paths:
      - app/fe/app/portfolio/[case]/system-details.tsx
      - app/fe/app/portfolio/[case]/case-details.tsx
      - app/fe/content/resumes/role-variants.ts
      - app/fe/content/documents/jyp-v2.ts
      - app/fe/content/portfolios/jyp-v2.ts
    patterns:
      - '(?i)재오픈|reopen|재발.{0,30}(?:감소|줄)|37\s*%|26\s*%p|94\s*%|4\.45?\s*건|0\.(?:26|3)\s*건'
      - '"rebuild-decision"'

# 구 게이트 11의 제목 키워드 할당량은 2026-09-07 폐기. §1-6·게이트 24·25 사람 검사로 판단한다.

# 게이트 12 — 공개 금지어 (public-safety Internal Product Names · §1-6)
banned_terms:
  - { label: "Centurion", pattern: "Centurion" }
  - { label: "BAY", pattern: "\\bBAY\\b" }
  - { label: "SAY", pattern: "\\bSAY\\b" }
  - { label: "NEXUS", pattern: "\\bNEXUS\\b" }
  - { label: "Procedure Hub", pattern: "(?i)procedure[ _-]?hub(?![.-])" }
  - { label: "돈을 내는", pattern: "돈을 내는" }
  - { label: "95%", pattern: "95%" }
  - { label: "2~3명", pattern: "2~3명" }
  - { label: "스쿼드 리더", pattern: "스쿼드 리더" }
  - { label: "3분의 1", pattern: "3분의 1" }
  - { label: "local draft", pattern: "local draft" }
  - { label: "대체된다", pattern: "대체된다" }
  - { label: "○○ 지원 문서", pattern: "지원 ?(경력기술서|이력서|포트폴리오|CV|패키지)|지원용" }
# 검사에서 건너뛰는 줄 (식별자·claim 참조·import·주석)
skip_line_pattern: "claimIds|data-claim|\\bslug\\b|\\bid:|^\\s*(import|//)|^\\s*\"[a-z0-9][a-z0-9.-]*\",?\\s*$"

# 게이트 13 — frozen 패키지 표면 불변. 해제는 환경변수 COPY_ALLOW_FROZEN=1 (verify --allow-frozen)
frozen:
  enforce: fail

# 게이트 14 — 헤더 직함은 registry attempt 의 header_role 로 시작한다 (§1-6 역할 표기)
header_role:
  require_for_active: true

# 게이트 16 — hero 소개는 두 문장까지 (§2 hero 규칙). introduction_prefix: 회사별 포폴 introduction 첫 문장은 15초 문장의 첫 사실로 시작 (§1-1)
hero:
  max_sentences: 2
  introduction_prefix: "기획자로 시작해"
  brand_line: "가능성을 기회로 바꾸고, 제품으로 가치를 전하는 메이커 김대정입니다."
  brand_line_en: "I’m Daejeong Kim, a maker who turns possibilities into opportunities and delivers value through products."
  # 브랜딩 문장은 하나다(2026-09-03 user-confirmed: 문서별로 바꾸지 않는다). 이력서 summary[0]·경력기술서 부제·포폴 headline 모두 이 문장과 같아야 한다
  career_subtitle: "가능성을 기회로 바꾸고, 제품으로 가치를 전하는 메이커 김대정입니다."

# 게이트 17 — 플랫폼 필드 글자 수. `### 이름 · N자` 제목 바로 아래 ```text 블록의 길이(줄바꿈 제외) ≤ N
platform_fields:
  enforce: true
  surface_kind: platform
