# 공개 문안이 사는 파일의 인벤토리. skill과 validator가 같은 파일을 읽는다.
# 소유: wiki/rules/application-copy-standard.md §1-6 "공통 문서 동기화" · design: wiki/backlog/agent-harness-operationalization/design-v1.md §3-1
schema_version: 1

# per_company 표면은 registry attempt의 artifacts.*.route 로 회사를 찾는다.
# route 의 {company} 자리가 path 의 {company} 로 들어간다.
surfaces:
  - id: resume.tailored
    route: "/resume/{company}"
    path: "app/fe/content/resumes/{company}.ts"
    per_company: true
    kind: resume
  - id: career.tailored
    route: "/career/{company}"
    path: "app/fe/content/documents/{company}.ts"
    per_company: true
    kind: career-description
  - id: cv.tailored
    route: "/cv/{company}"
    path: "app/fe/content/documents/{company}.ts"
    per_company: true
    kind: cv
  - id: portfolio.tailored
    route: "/portfolio/{company}"
    path: "app/fe/content/portfolios/{company}.ts"
    per_company: true
    kind: portfolio
  - id: career.common
    routes: ["/career/common", "/cv/common"]
    path: "app/fe/content/documents/common.ts"
    per_company: false
  - id: resume.common
    routes: ["/resume"]
    path: "app/fe/app/resume/resume-view.tsx"
    per_company: false
  - id: cases
    routes: ["/portfolio"]
    path: "app/fe/lib/cases.ts"
    per_company: false

# registry attempt 가 active 인 조건. active 표면만 게이트 11·12·14·16 검사 대상이다.
active:
  statuses: ["pre-apply", "in-progress", "approved"]
  exclude_artifact_states: ["frozen"]

rules:
  - 회사별 문안 규칙이 바뀌면 common·cases 표면도 같은 작업에서 맞춘다 (copy-standard §1-6)
  - frozen 패키지의 per_company 표면은 읽기 전용이다 (게이트 13)
