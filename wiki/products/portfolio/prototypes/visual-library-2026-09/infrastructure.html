<header><h1>THREADY <span>/ Infrastructure Architecture</span></h1><p>운영 근거 기반 참조 구성 · 환경별 패턴 STG / Prod</p></header>
<svg viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Thready의 관리형 서버·데이터·배포·관측 구성</title><desc id="desc">클라이언트는 Vercel 웹 화면에 접속하고 Azure의 제품 API에 HTTPS 요청을 보냅니다. 제품과 AI는 각각 Azure App Service로 운영하며 인증 HTTP로 통신하고 독립 PostgreSQL 데이터를 소유합니다. GitHub Actions는 컨테이너 이미지를 Azure Container Registry로 배포하고 App Service가 그 이미지를 사용합니다. App Service 진단 로그는 환경별 Azure Monitor와 Log Analytics에서 수집·조회합니다. 그룹은 관리형 서비스의 논리 분류이며 VNet이나 서브넷을 의미하지 않습니다. 서버 복제 수와 사설 연결은 표시하지 않습니다.</desc>
