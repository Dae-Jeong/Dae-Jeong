<header><h1>Outbox · 전달과 복구의 내부 동작</h1><a href="index.html#outbox">기존 구성도와 비교 ↗</a></header>
<p class="intro">원장 저장의 원자성, 전달 시도의 소유권, 수신 데이터의 최신성을 서로 다른 경계에서 지켰습니다. 정상 경로 아래에는 중단·늦은 완료·재전송 시의 처리 규칙을 연결했습니다.</p>
<svg viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Outbox 정상 전달과 실패 복구의 세 책임 경계</title><desc id="desc">제품 DB에서 원장과 Outbox를 같은 트랜잭션으로 기록합니다. Relay는 lease와 시도 토큰으로 작업을 점유해 전송합니다. 수신 서비스는 새 버전만 반영하고 중복과 오래된 버전은 변경 없이 종료합니다. 응답을 받은 Relay는 현재 토큰과 일치할 때만 전달 결과를 기록합니다. 중단 시 lease 만료와 시도 상한, 늦은 완료 시 토큰 불일치, 응답 유실 뒤 재전송 시 버전 fence를 각각 적용합니다.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#6587a4"/></marker><marker id="amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#b1844a"/></marker></defs>

<rect x="20" y="30" width="380" height="505" rx="12" class="lane"/><rect x="430" y="30" width="465" height="505" rx="12" class="lane"/><rect x="925" y="30" width="455" height="505" rx="12" class="lane"/>
<text x="44" y="67" class="heading">01 · 제품 DB / Outbox</text><text x="454" y="67" class="heading">02 · 전달 Relay</text><text x="949" y="67" class="heading">03 · AI 수신 서비스</text>
<text x="44" y="93" class="minor">원장과 전달 기록의 원자성</text><text x="454" y="93" class="minor">lease · 현재 전달 시도의 소유권</text><text x="949" y="93" class="minor">멱등 반영 · 최신 버전 보호</text>

<rect x="60" y="135" width="300" height="225" rx="9" class="txn"/>
<text x="210" y="167" text-anchor="middle" class="strong">하나의 DB 트랜잭션</text>

<text x="210" y="280" text-anchor="middle">Outbox 전달 기록</text><text x="210" y="309" text-anchor="middle" class="minor">전달할 상태 + 버전</text>
<text x="210" y="343" text-anchor="middle" class="strong">함께 COMMIT</text>
<text x="210" y="408" text-anchor="middle" class="minor">실패하면 두 변경 모두 rollback</text><text x="210" y="434" text-anchor="middle" class="minor">외부 전송은 커밋 이후에 수행</text>

<text x="662" y="167" text-anchor="middle" class="strong">전달 대상 점유</text><text x="662" y="197" text-anchor="middle" class="minor">lease 확보 · 버전 + 시도 횟수로 토큰 식별</text>
<path d="M360 333H415V180H470" class="edge"/><text x="412" y="270" text-anchor="middle" class="caption" transform="rotate(-90 412 270)">commit 이후</text>
<path d="M662 225V268" class="edge"/>
<rect x="470" y="270" width="385" height="74" rx="9" class="step"/>
<text x="662" y="300" text-anchor="middle" class="strong">상태 전달 요청</text><text x="662" y="327" text-anchor="middle" class="minor">전송 실패와 결과 기록을 분리</text>
<path d="M855 307H977" class="edge"/><text x="915" y="286" text-anchor="middle" class="caption">상태 · 버전</text>

<rect x="980" y="270" width="350" height="74" rx="9" class="gate"/>
<text x="1155" y="300" text-anchor="middle" class="strong">기존 반영 버전과 비교</text><text x="1155" y="327" text-anchor="middle" class="minor">수신 측 version fence</text>
<path d="M1155 344V377H1047V407" class="edge"/><path d="M1155 377H1260V407" class="edge"/>
<text x="1038" y="368" text-anchor="middle" class="caption">새 버전</text><text x="1270" y="368" text-anchor="middle" class="caption">동일 · 이전 버전</text>
<rect x="952" y="410" width="190" height="66" rx="8" class="step"/><rect x="1165" y="410" width="190" height="66" rx="8" class="step"/>

<rect x="470" y="405" width="385" height="80" rx="9" class="gate"/><text x="662" y="435" text-anchor="middle" class="strong">현재 토큰 확인 → 결과 기록</text><text x="662" y="463" text-anchor="middle" class="minor">전달 완료 / 재시도 / 최종 실패</text>
<path d="M1047 476V508H662V488" class="edge return"/><path d="M1260 476V508H1047" fill="none" stroke="#6587a4" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="925" y="498" text-anchor="middle" class="caption">응답 후 기록</text>
<path d="M662 344V402" class="branch"/><text x="736" y="380" text-anchor="middle" class="caption">전송 실패</text>

<text x="22" y="572" class="heading">실패했을 때 지켜지는 규칙</text>
<rect x="20" y="595" width="440" height="177" rx="10" class="fault"/><rect x="480" y="595" width="440" height="177" rx="10" class="fault"/><rect x="940" y="595" width="440" height="177" rx="10" class="fault"/>
<text x="42" y="625" class="strong amber">A · 점유한 worker가 중단됨</text>
<text x="42" y="659">lease 만료 → 시도 상한 확인</text>
<path d="M42 677H438M502 677H898M962 677H1358" fill="none" stroke="#e7dccb"/>
<!-- Local grid: label +0, arrow +90..120, result +138; shared row baselines. -->
<g transform="translate(42 0)">
<text x="0" y="706" class="minor">상한 전</text><path d="M90 700H120" class="branch"/><text x="138" y="706">재시도 가능 · 재점유</text>
<text x="0" y="746" class="minor">마지막 시도</text><path d="M90 740H120" class="branch"/><text x="138" y="746">최종 실패로 보존</text>
</g>
<text x="502" y="625" class="strong amber">B · 이전 worker가 늦게 완료함</text><text x="502" y="659">새 점유 이후, 이전 토큰으로 결과 기록</text>
<g transform="translate(502 0)">
<text x="0" y="706" class="minor">판정</text><path d="M90 700H120" class="branch"/><text x="138" y="706">현재 토큰과 불일치</text>
<text x="0" y="746" class="minor">처리</text><path d="M90 740H120" class="branch"/><text x="138" y="746">늦은 결과 기록 차단</text>
</g>
<text x="962" y="625" class="strong amber">C · 수신은 반영했지만 응답을 놓침</text><text x="962" y="659">응답 유실 후 동일 버전 재전송</text>
<g transform="translate(962 0)">
<text x="0" y="706" class="minor">버전 판정</text><path d="M90 700H120" class="branch"/><text x="138" y="706">이미 반영한 버전</text>
<text x="0" y="746" class="minor">처리</text><path d="M90 740H120" class="branch"/><text x="138" y="746">변경 없이 종료</text>
</g>
</svg>
<div class="foot"><p>직접 설계·구현 · 양쪽 서비스 회귀 및 오래된 변경·삭제 요청의 버전 차단 검증</p><p>공개 가능한 처리 패턴 · 응답 유실은 재전송 동작을 설명하는 시나리오이며 운영 사고 발생 주장이 아님</p></div>
