      - { id: careers, label: 경력 4건, note: 인증 경력 날짜 수정 불가 · 더데이랩스 별도 row 미적용 }
      - { id: skills, label: 스킬 }
      - { id: link, label: 링크, value: https://marinkim.xyz }
