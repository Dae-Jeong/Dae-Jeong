# 채용 플랫폼 프로필 registry — 플랫폼·필드·제약·live 상태의 단일 owner.
# canonical 문안은 같은 폴더의 {platform}.md, 적용 절차는 README.md · skill sync-platform-profile.
schema_version: 1
updated_at: "2026-09-03"
browser: orca-embedded             # 2026-09-03부터 검토·적용은 Orca 내장 브라우저(orca tab/snapshot/fill). 로그인은 사용자가 Orca 탭에서 직접
canonical_version: maker-v5               # 2026-09-04 둘째 문단에 '월 1천만원 수준의 구독 매출이 발생하는 제품' (user-confirmed)

platforms:
  - id: wanted
    name: 원티드
    url: https://social.wanted.co.kr/my/profile
    status: active
    canonical: wanted.md
    live_version: mixed             # 프로필 소개 maker-v5(Orca) / 이력서 간단 소개·성과 제목은 사람이 붙여넣기 대상
    live_verified_at: \"2026-09-03\"
    drift: true                     # 프로필 소개는 maker-v5 적용(2026-09-04). 기본 이력서 간단 소개는 폐기된 Product Engineer 문장 잔존 → 사람이 붙여넣기
    notes: "이력서 경력 한줄 요약(business_title)은 옛 제목 '유료 AI 제품 운영과 백엔드·AI 시스템 구축' 그대로(금지어 없음). 간단 소개·성과 제목 textbox는 자동 입력 5회 미저장 → 다음에도 사람이 붙여넣기"
    automation:
      text_input: partial           # 경력 본문 textarea는 fill + 작성 완료로 저장됨(2026-09-03 Orca). 간단 소개·제목 textarea는 미저장
      click_fields: auto            # 직무·스킬 combobox·삭제
    fields:
      - { id: intro-short, label: 프로필 소개, limit: 150, surface: profile }
      - { id: intro, label: 이력서 간단 소개, surface: resume, note: 5줄 권장 }
      - { id: ai-usage, label: AI 활용 경험 3항목, limit: 50, note: 항목당 50자 }
      - { id: job, label: 직무, value: 백엔드 개발자 }
