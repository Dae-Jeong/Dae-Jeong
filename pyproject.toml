# Repo-root tooling env only (validator, export, JD tools, PDF render).
# App envs are independent: app/be and labs/{svc} own their manifests.
[project]
name = "daejeong-repo-tools"
version = "0.1.0"
description = "Monorepo root tooling for the Dae-Jeong knowledge harness and site (validator, export, JD, PDF render)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "playwright==1.61.0",
  "pyyaml==6.0.3",
]

[tool.uv]
package = false
