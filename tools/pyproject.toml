# repo root의 도구 환경 전용 (validator·export·JD 도구·PDF 렌더).
# 앱 env는 독립 — app/be와 labs/{svc}는 각자 manifest·env를 소유한다.
[project]
name = "daejeong-repo-tools"
version = "0.1.0"
description = "Dae-Jeong monorepo의 root 도구 환경 (validator, export, JD, PDF 렌더)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pillow>=12.3.0",
  "playwright==1.61.0",
  "pyyaml==6.0.3",
]

[tool.uv]
package = false
