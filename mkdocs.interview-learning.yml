site_name: 기술 기본기 학습서
site_description: 상위 개념을 먼저 이해하고 실제 사용 스택으로 내려가는 개인 기술 학습서
site_url: http://127.0.0.1:8010/
docs_dir: wiki/products/interview-learning
site_dir: output/interview-learning/site
use_directory_urls: true
exclude_docs: |
  README.md
  templates/

theme:
  name: material
  language: ko
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 어두운 화면으로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 밝은 화면으로 전환

plugins:
  - search:
      lang:
        - ko
        - en
      separator: '[\s\-\.·→/]+'

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/vendor/mermaid-11.12.0.min.js
  - assets/mermaid-init.js
  - assets/messaging-walkthrough.js
  - assets/resume-viewer.js

nav:
  - 학습 시작: index.md
  - 1. 인덱스: lessons/db-indexes.md
  - 2. 트랜잭션: lessons/transactions-sqlalchemy.md
  - 3. SQLAlchemy Session: lessons/sqlalchemy-session.md
  - 4. 비동기 I/O · FastAPI: lessons/python-fastapi-async.md
  - 5. 메시징 구조 · 코드: lessons/messaging-basics.md
  - 6. 작업 큐 · 발행구독: lessons/messaging-patterns.md
  - 7. RabbitMQ 라우팅: lessons/rabbitmq-operations.md
  - 8. ACK · 재전달: lessons/rabbitmq-delivery.md
  - 9. TaskIQ 역할: lessons/taskiq-role.md
  - 보충 자료:
      - 읽는 방법: reading-guide.md
      - 용어집: glossary.md
      - 핵심 흐름:
          - 요청과 DB 경계: core/01-safe-request.md
          - 데이터 조회와 동시성: core/02-data-correctness-speed.md
          - 오래 걸리는 작업: core/03-long-running-work.md
          - 외부 시스템 상태: core/04-cross-system-state.md
          - 사용자 진행 상태: core/05-user-progress.md
          - AI 결과와 품질: core/06-ai-product-quality.md
          - 배포와 운영: core/07-safe-delivery-operations.md
      - 스택별 심화:
          - 스택 9항목 요약: quick-core.md
          - DB · ORM: areas/01-db-orm.md
          - RabbitMQ · TaskIQ: areas/02-rabbitmq-taskiq.md
          - Python · FastAPI: areas/03-python-fastapi.md
          - Redis · Auth · WebSocket: areas/04-redis-auth-websocket.md
          - 결제 · 예약: areas/05-payments-reservations.md
          - Delivery · Infra · 관측: areas/06-infra-observability.md
          - AI · Data: areas/07-ai-data.md
          - FE · Product · Leadership: areas/08-fe-product-leadership.md
      - 이력서 · 출처:
          - 이력서 연결표: coverage.md
          - 이력서 출처: source-map.md
      - 실습:
          - 학습 시작: practice/start.md
          - 20시간 준비 작업 지도: practice/canvas-editor-20h-draft.md
          - 1. 문서·요소·이동·Undo: practice/01-editor-core.md
          - 2. 저장·복원·트랜잭션: practice/02-document-save.md
          - 3. 인덱스와 저장 충돌: practice/03-index-conflict.md
          - 4. 오래 걸리는 작업과 상태 복구: practice/04-async-job.md
          - 5. 실험을 TPM 판단으로 바꾸기: practice/05-product-decision.md
          - 이력서·JD·실습 대응표: practice/mapping.md
          - 실습 기록 양식: practice/lab-note.md
      - 학습 운영:
          - 학습 상태표: progress.md
          - 매일 30~45분 루프: daily-loop.md
          - 학습 세션: study-templates/study-session.md
          - 오답 기록: study-templates/wrong-answer.md
          - 실행 안내: runbook.md
